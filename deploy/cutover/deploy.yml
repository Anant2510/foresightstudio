# =====================================================================
# CUTOVER: turn an app's GitHub Pages site into a redirect to the xPerion VM
#
# Works in any app repo (foresightstudio, westjet-aa-dashboard, CareAI, ...):
# copy this file over .github/workflows/deploy.yml (create it if the repo has none).
# Target: https://xperion2.centralindia.cloudapp.azure.com/<repo name in lowercase>/
# Override with a repo variable XPERION_URL if an app lives somewhere else.
#
# Repos that publish Pages "from a branch" (no workflow today) also need:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
# Afterwards delete any API-key secret in the repo and revoke that key.
# =====================================================================
name: Redirect GitHub Pages to the xPerion VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Build redirect page
        env:
          OVERRIDE: ${{ vars.XPERION_URL || vars.FORESIGHT_URL }}
        run: |
          APP=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          TARGET="${OVERRIDE:-https://xperion2.centralindia.cloudapp.azure.com/$APP/}"
          echo "Redirecting to $TARGET"
          mkdir -p site
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>This demo has moved</title>
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$TARGET">
          <script>location.replace("$TARGET");</script>
          </head><body style="font-family:Inter,system-ui,sans-serif;color:#082340;padding:48px">
          <p>This demo has moved to <a href="$TARGET" style="color:#F15B40">$TARGET</a>.</p>
          </body></html>
          HTML
          cp site/index.html site/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
