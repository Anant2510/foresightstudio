<style>
  :root { --navy:#082340; --orange:#F15B40; --border:#e8ecf0; --muted:#64748b; }
  html, body { margin:0; height:100%; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f4f6fa; }
  .bar { height:58px; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:16px;
         padding:0 24px; background:#fff; border-bottom:1px solid var(--border); position:relative; z-index:2; }
  .left { display:flex; align-items:center; gap:16px; min-width:0; }
  .logo { height:46px; width:auto; display:block; flex-shrink:0; }
  .divider { width:1px; height:26px; background:#d1d9e0; flex-shrink:0; }
  .title { font-size:15px; font-weight:700; color:var(--navy); white-space:nowrap; }
  .title span { color:var(--orange); }
  .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .back { flex-shrink:0; font-size:13px; font-weight:600; color:var(--navy); text-decoration:none;
          border:1px solid #d1d9e0; border-radius:8px; padding:8px 14px; background:#fff; }
  .back:hover { border-color:var(--orange); color:var(--orange); }
  .stage { position:relative; height:calc(100% - 58px); }
  .loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:12px; color:var(--muted); font-size:14px; z-index:0; }
  .spinner { width:28px; height:28px; border-radius:50%; border:3px solid #e2e8f0; border-top-color:var(--orange); animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { position:relative; z-index:1; display:block; width:100%; height:100%; border:0; background:transparent; }
  @media (max-width: 900px) { .sub { display:none; } }
</style>
